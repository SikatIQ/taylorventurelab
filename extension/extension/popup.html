<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>TaylorVentureLab Feed</title>
<style>
body { margin:0; padding:12px; font-family:-apple-system,system-ui;
background:#050816; color:#f9fafb; width:360px; max-height:600px; overflow-y:auto }
h1 { font-size:16px; margin:0 0 8px }
.item { background:#0b1020; border-radius:8px; padding:10px; margin-bottom:8px }
.item-title { font-size:13px; font-weight:600 }
.item-meta { font-size:10px; color:#9ca3af; margin:4px 0 }
.item-summary { font-size:12px; line-height:1.4 }
button { padding:4px 10px; background:#1f2937; border-radius:999px; border:none; color:#fff; font-size:11px; cursor:pointer }
button:hover { background:#374151 }
.error { color:#f97373; font-size:12px }
</style>
</head>

<body>
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
<h1>TaylorVentureLab Feed</h1>
<button id="refresh-btn">Refresh</button>
</div>
<div id="source-label" style="font-size:11px;color:#9ca3af;margin-bottom:10px;">Loading…</div>
<div id="feed-root"></div>
<div id="error" class="error"></div>
<script src="src/popup.js"></script>
</body>
</html>
